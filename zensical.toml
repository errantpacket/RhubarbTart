# The documentation site (#37), built from docs/ by Zensical (the successor to Material for
# MkDocs, from the same authors). Zensical is pinned and hash-locked in tools/docs_site.py(.lock):
#   uv run --script tools/docs_site.py serve           # preview at http://localhost:8000
#   uv run --script tools/docs_site.py build --strict  # what check.sh and CI run
# docs/ stays the source; GitHub renders the same files. The site is published to GitHub Pages
# by .github/workflows/docs.yml.
#
# The design records (uppercase names) and the history-rewrite record stay in the repository for
# contributors but are left out of the site; public pages link to them on GitHub instead.

[project]
site_name = "🍎 RhubarbTart"
site_description = "Security-research VMs for Apple silicon, built from verified vendor installers."
site_url = "https://errantpacket.github.io/RhubarbTart/"
repo_url = "https://github.com/errantpacket/RhubarbTart"
repo_name = "errantpacket/RhubarbTart"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "RhubarbTart is licensed under FSL-1.1-ALv2."

nav = [
  { "Home" = "README.md" },
  { "Get started" = [
    { "Quick start" = "quickstart.md" },
    { "Key concepts" = "concepts.md" },
    { "How it works" = "how-it-works.md" },
  ] },
  { "Guides" = [
    { "Guests and profiles" = "profiles.md" },
    { "Using your VMs" = "using.md" },
    { "Engagements and evidence" = "engagements.md" },
    { "Agents with herdr" = "agents.md" },
    { "Publishing and stacked clones" = "publishing.md" },
  ] },
  { "Topics" = [
    { "Testing macOS and iOS apps" = "testing-apple-apps.md" },
    { "macOS guests and containers" = "macos-and-containers.md" },
    { "Trust model and security posture" = "trust-model.md" },
  ] },
  { "Reference" = [
    { "Reference" = "reference.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Development" = "development.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Only what the docs use: callouts, collapsible blocks, tables, code and Mermaid diagrams.
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Zensical doesn't support MkDocs' exclude_docs yet; its own exclude plugin drops these from the
# site and the search index.
[project.plugins.exclude]
glob = ["PLAN.md", "INTERFACE-PLAN.md", "ENGAGEMENT-PLAN.md", "HERDR-CHARTER.md", "IOS-PLAN.md", "history-rewrite.md"]
